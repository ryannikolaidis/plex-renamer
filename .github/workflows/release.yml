name: Release

# Triggered on pushed tags matching ``v*``. Builds PyInstaller artifacts
# for macOS and Windows in parallel and uploads them to a GitHub
# Release. The CI workflow at ``.github/workflows/ci.yml`` continues to
# gate every push and pull request; this workflow is independent and
# only runs on tag pushes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # Match the local-dev convention from .agents.md.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups

      # --- macOS build -------------------------------------------------

      - name: PyInstaller build (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller packaging/macos/plex-renamer.spec \
            --distpath dist --workpath build --noconfirm

      - name: Smoke-test CLI (macOS)
        if: runner.os == 'macOS'
        env:
          CI: "true"
          PLEX_RENAMER_DIST_DIR: dist/plex-renamer-cli
        run: uv run pytest tests/test_packaging_smoke.py -v

      - name: Build .dmg (macOS)
        if: runner.os == 'macOS'
        # hdiutil occasionally fails with "Resource busy" on macos-latest
        # when Spotlight or Time Machine has the source folder open;
        # retry up to 3 times with a short backoff. hdiutil is otherwise
        # deterministic, so the retry only ever masks the flake.
        run: |
          mkdir -p dist/dmg-staging
          cp -R dist/plex-renamer.app dist/dmg-staging/
          cp -R dist/plex-renamer-cli dist/dmg-staging/
          for attempt in 1 2 3; do
            if hdiutil create \
                -volname plex-renamer \
                -srcfolder dist/dmg-staging \
                -ov -format UDZO \
                dist/plex-renamer.dmg; then
              break
            fi
            echo "hdiutil attempt ${attempt} failed; sleeping then retrying"
            sleep 5
          done
          test -f dist/plex-renamer.dmg

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: plex-renamer-macos
          # Only upload the .dmg. The .app bundle lives inside it; uploading
          # the .app directory standalone through softprops/action-gh-release@v2
          # later would scatter every internal file (Info.plist, Qt dylibs)
          # as separate Release assets because the glob does not auto-archive
          # directories. End users mount the .dmg and drag the .app to
          # /Applications.
          path: dist/plex-renamer.dmg
          if-no-files-found: error

      # --- Windows build -----------------------------------------------

      - name: Set up .NET 8 (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: PyInstaller build CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller packaging/windows/plex-renamer-cli.spec --distpath dist --workpath build --noconfirm

      - name: PyInstaller build engine sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller packaging/windows/plex-renamer-engined.spec --distpath dist --workpath build --noconfirm

      - name: dotnet publish WPF native shell (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet publish windows-native/PlexRenamer.sln -c Release -r win-x64 --self-contained false -o dist/plex-renamer-gui

      - name: Smoke-test CLI (Windows)
        if: runner.os == 'Windows'
        env:
          CI: "true"
          PLEX_RENAMER_DIST_DIR: dist/plex-renamer-cli
        run: uv run pytest tests/test_packaging_smoke.py -v

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        # chocolatey installs makensis under C:\Program Files (x86)\NSIS\ but
        # does NOT refresh the current PowerShell session's PATH. Add the
        # install dir to $GITHUB_PATH so the next step can call makensis
        # without a fully-qualified path.
        run: |
          choco install -y nsis --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Read app version (Windows)
        if: runner.os == 'Windows'
        id: app_version
        shell: bash
        run: |
          # The ``packaging/`` directory name collides with the PyPI
          # ``packaging`` library, so the helper is loaded via
          # importlib.util.spec_from_file_location rather than a normal import.
          VERSION=$(uv run python -c "import importlib.util; spec = importlib.util.spec_from_file_location('h', 'packaging/pyinstaller_spec.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print(m.app_version())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        # The argument MUST be quoted: PowerShell otherwise parses
        # ``-DAPP_VERSION=0.1.0`` as ``-DAPP_VERSION=0`` followed by
        # ``.1.0`` (a member-access expression), leading makensis to
        # report ``Can't open script ".1.0"``. Quoting forces a single
        # native-command argument across the dot-separated version.
        run: makensis "-DAPP_VERSION=${{ steps.app_version.outputs.version }}" packaging/installer/nsis_script.nsi

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: plex-renamer-windows
          # Only upload the NSIS installer. The bare CLI/GUI .exe files are
          # PyInstaller one-folder launchers that require their sibling
          # _internal/ runtime directories — they do not execute standalone
          # when downloaded from a Release asset. The installer correctly
          # bundles both folders into a single setup.exe.
          path: dist/plex-renamer-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          # Two user-facing assets: the macOS .dmg (mount + drag to
          # /Applications) and the Windows NSIS installer (run + follow
          # prompts). Both wrap their respective PyInstaller one-folder
          # bundles so the runtime sibling files reach the user intact.
          files: |
            artifacts/plex-renamer-macos/**
            artifacts/plex-renamer-windows/**

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libs (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libfontconfig1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Lockfile is clean (no private indexes leaked)
        shell: bash
        run: |
          if grep -q 'pkgs.dev.azure.com\|pkgs.dev\.amazonaws\|jfrog\|artifactory' uv.lock; then
            echo "ERROR: uv.lock contains private-index URLs. Re-resolve from a clean env." >&2
            exit 1
          fi

      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v

      - name: Build engine sidecar (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run pyinstaller packaging/windows/plex-renamer-engined.spec --noconfirm
          # Smoke: pipe a single get_settings request and assert the
          # daemon emits one non-error response line. If the spec is
          # broken (missing hidden imports, wrong entry point) this
          # fails here rather than three slices later.
          echo '{"jsonrpc":"2.0","id":1,"method":"get_settings","params":{}}' \
            | ./dist/plex-renamer-engined/plex-renamer-engined.exe \
            | python -c 'import sys, json; r = json.loads(sys.stdin.readline()); assert r["id"] == 1 and "result" in r, r; print("daemon smoke OK")'

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libs (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libfontconfig1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Lockfile is clean (no private indexes leaked)
        shell: bash
        run: |
          if grep -q 'pkgs.dev.azure.com\|pkgs.dev\.amazonaws\|jfrog\|artifactory' uv.lock; then
            echo "ERROR: uv.lock contains private-index URLs. Re-resolve from a clean env." >&2
            exit 1
          fi

      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v

      - name: Detect WPF-relevant changes (Windows only)
        if: runner.os == 'Windows'
        id: wpf_changed
        uses: dorny/paths-filter@v3
        with:
          # The WPF build / test step is the slowest part of the Windows
          # CI job (~2-3 min for restore + build + test). Skip it on
          # pushes that don't touch the WPF code, the daemon (whose
          # protocol the WPF code mirrors), or the protocol doc itself.
          filters: |
            wpf:
              - 'windows-native/**'
              - 'src/plex_renamer/daemon/**'
              - 'docs/win-native-bridge.md'

      - name: Set up .NET 8 (Windows only, WPF-relevant changes)
        if: runner.os == 'Windows' && steps.wpf_changed.outputs.wpf == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and test windows-native (Windows only, WPF-relevant changes)
        if: runner.os == 'Windows' && steps.wpf_changed.outputs.wpf == 'true'
        shell: bash
        run: |
          cd windows-native
          dotnet restore PlexRenamer.sln
          dotnet build PlexRenamer.sln --no-restore --configuration Release
          dotnet test PlexRenamer.sln --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Build and smoke-test engine sidecar (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run pyinstaller packaging/windows/plex-renamer-engined.spec --noconfirm
          # Multi-request smoke against the bundled binary. Catches spec
          # breakage classes that a single-request smoke would miss:
          #   - missing hidden imports / wrong entry point (the daemon
          #     would crash before printing anything),
          #   - --onefile single-shot behavior (the daemon would exit
          #     after one response and the second request would hang),
          #   - shutdown handling (the daemon's clean-exit path is
          #     load-bearing for the shell's lifecycle).
          # Pipes get_settings, then a second get_settings (proving the
          # daemon is long-running), then shutdown (proving the clean
          # exit path), then asserts the binary exited with code 0.
          python -c "
          import json, subprocess, sys
          proc = subprocess.Popen(
              ['./dist/plex-renamer-engined/plex-renamer-engined.exe'],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )
          def send(req):
              proc.stdin.write(json.dumps(req) + '\n')
              proc.stdin.flush()
              return json.loads(proc.stdout.readline())
          r1 = send({'jsonrpc': '2.0', 'id': 1, 'method': 'get_settings', 'params': {}})
          assert r1.get('jsonrpc') == '2.0' and r1.get('id') == 1 and 'result' in r1, r1
          r2 = send({'jsonrpc': '2.0', 'id': 2, 'method': 'get_settings', 'params': {}})
          assert r2.get('id') == 2 and 'result' in r2, r2
          r3 = send({'jsonrpc': '2.0', 'id': 3, 'method': 'shutdown'})
          assert r3.get('id') == 3 and r3.get('result', {}).get('ok') is True, r3
          proc.wait(timeout=10)
          assert proc.returncode == 0, f'daemon exit code: {proc.returncode}, stderr: {proc.stderr.read()}'
          print('daemon smoke OK')
          "

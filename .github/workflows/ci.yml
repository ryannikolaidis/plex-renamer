name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Lockfile is clean (no private indexes leaked)
        shell: bash
        run: |
          if grep -q 'pkgs.dev.azure.com\|pkgs.dev\.amazonaws\|jfrog\|artifactory' uv.lock; then
            echo "ERROR: uv.lock contains private-index URLs. Re-resolve from a clean env." >&2
            exit 1
          fi

      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v

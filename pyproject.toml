[project]
name = "plex-renamer"
version = "0.1.1"
description = "Cross-platform desktop app that renames movie and TV files into Plex's expected naming format."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Ryan Nikolaidis" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "platformdirs>=4.3",
]

[project.scripts]
plex-renamer = "plex_renamer.cli.main:app"

[project.gui-scripts]
plex-renamer-gui = "plex_renamer.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.7",
    "responses>=0.25",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plex_renamer"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
